[package]
name = "nmkill"
version = "0.1.0"
edition = "2024"
description = "Busca y borra carpetas node_modules a toda velocidad (escaneo y borrado en paralelo)"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.29"
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
